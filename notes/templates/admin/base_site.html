{% extends "admin/base.html" %}

{% block title %}{{ title }} | CloudNotes Admin{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    /* =========================================
       LIQUID GLASS THEME PULIDO PARA DJANGO ADMIN
       ========================================= */
    :root {
        --primary: #06b6d4;
        --secondary: #8b5cf6;
        --bg-dark: #07090e;
        --glass-bg: rgba(18, 24, 38, 0.65);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
    }

    /* 1. OCULTAR ELEMENTOS BLANCOS / NATIVOS MOLESTOS */
    #skip-to-content, 
    .skip-to-content-link, 
    a[href="#content"],
    .theme-toggle, 
    #theme-toggle {
        display: none !important;
    }

    /* 2. FONDO LÍQUIDO NEÓN */
    body {
        font-family: 'Plus Jakarta Sans', sans-serif !important;
        background-color: var(--bg-dark) !important;
        background-image: 
            radial-gradient(circle at 15% 10%, rgba(6, 182, 212, 0.2) 0%, transparent 45%),
            radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.2) 0%, transparent 50%) !important;
        background-attachment: fixed !important;
        color: var(--text-main) !important;
        margin: 0;
        min-height: 100vh;
    }

    /* 3. BARRA SUPERIOR (HEADER GLASS) */
    #header {
        background: rgba(15, 23, 42, 0.8) !important;
        backdrop-filter: blur(20px) !important;
        -webkit-backdrop-filter: blur(20px) !important;
        border-bottom: 1px solid var(--glass-border) !important;
        color: #fff !important;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5) !important;
        padding: 16px 35px !important;
    }

    #site-name a {
        font-weight: 800 !important;
        font-size: 1.35rem !important;
        background: linear-gradient(135deg, #06b6d4, #8b5cf6) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        letter-spacing: -0.5px !important;
    }

    /* Herramientas de usuario y botón Log Out */
    #user-tools {
        color: var(--text-muted) !important;
        font-size: 0.85rem !important;
    }
    #user-tools a {
        color: #38bdf8 !important;
        border-bottom: none !important;
        font-weight: 600 !important;
    }
    #user-tools a:hover {
        color: #fff !important;
    }
    #user-tools form {
        display: inline !important;
    }
    #user-tools form button, #user-tools button {
        background: transparent !important;
        border: none !important;
        color: #f87171 !important;
        font-size: 0.85rem !important;
        font-weight: 600 !important;
        cursor: pointer !important;
        padding: 0 !important;
        margin-left: 6px !important;
    }
    #user-tools form button:hover, #user-tools button:hover {
        color: #ef4444 !important;
        text-decoration: underline !important;
    }

    /* 4. MIGAS DE PAN (BREADCRUMBS) */
    div.breadcrumbs {
        background: rgba(15, 23, 42, 0.5) !important;
        backdrop-filter: blur(10px) !important;
        border-bottom: 1px solid var(--glass-border) !important;
        color: var(--text-muted) !important;
        padding: 12px 35px !important;
        font-size: 0.85rem !important;
    }
    div.breadcrumbs a {
        color: #38bdf8 !important;
        font-weight: 500 !important;
    }

    /* 5. BARRA LATERAL (NAV-SIDEBAR) & FILTRO */
    #nav-sidebar {
        background: rgba(15, 23, 42, 0.6) !important;
        border-right: 1px solid var(--glass-border) !important;
    }
    #nav-filter {
        background: rgba(15, 23, 42, 0.7) !important;
        border-bottom: 1px solid var(--glass-border) !important;
        padding: 10px !important;
    }
    #nav-filter input {
        background: rgba(30, 41, 59, 0.7) !important;
        border: 1px solid var(--glass-border) !important;
        border-radius: 8px !important;
        color: #fff !important;
        padding: 6px 12px !important;
    }

    /* 6. MÓDULOS Y CAJAS GLASS */
    .module, .inline-group, #changelist {
        background: var(--glass-bg) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border: 1px solid var(--glass-border) !important;
        border-radius: 16px !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
        overflow: hidden !important;
        margin-bottom: 24px !important;
    }

    .module caption, .module h2 {
        background: rgba(255, 255, 255, 0.03) !important;
        color: #fff !important;
        font-weight: 700 !important;
        padding: 14px 20px !important;
        border-bottom: 1px solid var(--glass-border) !important;
    }

    /* 7. TABLAS GLASS */
    table {
        background: transparent !important;
        border-collapse: collapse !important;
        width: 100% !important;
    }

    thead th {
        background: rgba(255, 255, 255, 0.04) !important;
        color: #38bdf8 !important;
        font-size: 0.8rem !important;
        text-transform: uppercase !important;
        letter-spacing: 0.05em !important;
        border-bottom: 1px solid var(--glass-border) !important;
        padding: 12px 18px !important;
    }

    tbody tr {
        background: transparent !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;
        transition: background 0.2s ease !important;
    }

    tbody tr:hover {
        background: rgba(6, 182, 212, 0.08) !important;
    }

    tbody td, tbody th {
        padding: 14px 18px !important;
        color: var(--text-main) !important;
    }

    /* 8. BOTONES GRADIENTES / NEÓN */
    .button, input[type=submit], input[type=button], .submit-row input, a.button {
        background: linear-gradient(135deg, #06b6d4, #3b82f6) !important;
        color: #fff !important;
        font-weight: 600 !important;
        border: none !important;
        border-radius: 10px !important;
        padding: 8px 20px !important;
        cursor: pointer !important;
        box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3) !important;
        transition: all 0.25s ease !important;
        text-transform: none !important;
    }

    .button:hover, input[type=submit]:hover, a.button:hover {
        transform: translateY(-2px) !important;
        box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5) !important;
        opacity: 0.95 !important;
    }

    .button.default, input[type=submit].default {
        background: linear-gradient(135deg, #8b5cf6, #ec4899) !important;
        box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3) !important;
    }

    /* 9. INPUTS Y SELECTS */
    input[type=text], input[type=password], input[type=email], textarea, select {
        background: rgba(15, 23, 42, 0.7) !important;
        border: 1px solid var(--glass-border) !important;
        border-radius: 10px !important;
        color: #fff !important;
        padding: 8px 12px !important;
    }

    input:focus, textarea:focus, select:focus {
        border-color: #06b6d4 !important;
        outline: none !important;
        box-shadow: 0 0 12px rgba(6, 182, 212, 0.35) !important;
    }

    /* Contenedor */
    #content {
        padding: 25px 35px !important;
    }

    a:link, a:visited {
        color: #38bdf8 !important;
    }
    a:hover {
        color: #fff !important;
    }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">⚡ CloudNotes Admin</a>
</h1>
{% endblock %}
